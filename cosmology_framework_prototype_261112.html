escription": null}]}, {"response_id": "17", "constraint_id": "4", "constraint_name": "Cosmic microwave background", "display_order": "4", "core_explanation": "Matter and radiation begin in a hot, dense, optically thick state in which repeated interactions maintain a thermal radiation field. As the universe expands and cools, recombination reduces the free-electron density, photons decouple, and the thermal spectrum subsequently redshifts while retaining its blackbody form.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "MEDIUM", "assessment_summary": null, "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "10", "mechanism_name": "Hot dense early-universe plasma", "mechanism_description": null, "family_name": "Thermal history", "role": "Enabling", "response_description": null}, {"mechanism_id": "3", "mechanism_name": "FLRW cosmological redshift", "mechanism_description": null, "family_name": "Expanding Spacetime", "role": "Supporting", "response_description": null}]}, {"response_id": "1", "constraint_id": "5", "constraint_name": "Cosmic Dipoles", "display_order": "5", "core_explanation": "Cosmic dipoles arise primarily from the observer's motion relative to the cosmological rest frame. This produces a temperature dipole in the CMB through the relativistic Doppler effect, and directional variations in galaxy and quasar populations through Doppler boosting and relativistic aberration. The model predicts broadly aligned kinematic dipoles, with amplitudes dependent on the observed populations and additional contributions from large-scale structure.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "MEDIUM", "assessment_summary": "some radio-galaxy and quasar surveys report amplitudes exceeding the standard kinematic predictions. However, the observational picture remains contested, with recent analyses finding greater consistency with CMB-derived motion.", "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "12", "mechanism_name": "Doppler dipole from motion relative to the CMB rest frame", "mechanism_description": "Relative motion between an observer and a radiation field produces direction-dependent Doppler shifts, creating a dipolar anisotropy in the observed frequency or temperature.", "family_name": "Kinematic Effects", "role": "Primary", "response_description": "Applied to the observer's motion relative to the CMB rest frame, producing the observed temperature dipole."}]}, {"response_id": "18", "constraint_id": "6", "constraint_name": "CMB anisotropies / power spectrum", "display_order": "6", "core_explanation": "Acoustic oscillations in the pre-recombination photon–baryon plasma evolve from primordial density perturbations; ΛCDM reproduces the peak structure quantitatively.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "MEDIUM", "assessment_summary": null, "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "13", "mechanism_name": "Inflationary generation of primordial perturbations", "mechanism_description": "Quantum fluctuations generated during inflation are stretched to cosmological scales, producing an approximately adiabatic primordial perturbation spectrum.", "family_name": "Inflation", "role": "Seeding", "response_description": "Supplies the initial perturbation spectrum that drives the subsequent photon-baryon acoustic oscillations represented in the CMB power spectrum."}]}, {"response_id": "19", "constraint_id": "7", "constraint_name": "CMB temperature with redshift", "display_order": "7", "core_explanation": "Expansion predicts T(z)=T₀(1+z), broadly matching SZ-cluster and absorption-system inferences.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "LOW", "assessment_summary": null, "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "3", "mechanism_name" er": "9", "core_explanation": "Hierarchical halo growth, gas cooling, star formation, mergers, feedback and enrichment create evolving galaxy populations.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "MEDIUM", "assessment_summary": null, "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "15", "mechanism_name": "Baryonic cooling and star formation", "mechanism_description": null, "family_name": "Galaxy formation and evolution", "role": "Primary", "response_description": "Gas falls into gravitational potentials, cools, condenses and forms stars, producing the luminous galaxy component."}, {"mechanism_id": "16", "mechanism_name": "Hierarchical assembly and mergers", "mechanism_description": null, "family_name": "Galaxy formation and evolution", "role": "Primary", "response_description": "Galaxies subsequently grow and transform through mergers, accretion and interactions."}, {"mechanism_id": "14", "mechanism_name": "Cold dark matter structure growth", "mechanism_description": "Cold, effectively collisionless dark matter responds gravitationally to primordial density perturbations and forms the dominant underlying matter distribution on which baryonic structure subsequently develops.", "family_name": "Dark Matter Dynamics", "role": "Supporting", "response_description": "Provides the halo population and gravitational potential wells in which baryonic galaxies develop."}]}, {"response_id": "22", "constraint_id": "10", "constraint_name": "Time-domain behaviour", "display_order": "10", "core_explanation": "Cosmological expansion stretches observed timescales by the same (1+z) factor as wavelengths.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "LOW", "assessment_summary": null, "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "3", "mechanism_name": "FLRW cosmological redshift", "mechanism_description": null, "family_name": "Expanding Spacetime", "role": "Primary", "response_description": "Cosmological expansion stretches observed time intervals by the same (1+z) factor as wavelengths, predicting the corresponding time dilation in transient and variable-source light curves."}]}]}, {"model_id": "4", "name": "Milne Cosmology", "short_name": "MILNE", "description": "A homogeneous and isotropic cosmological model developed by Edward Arthur Milne in the 1930s, based on special relativity. It describes cosmic redshift as a consequence of the relative motion of galaxies through flat spacetime, rather than the expansion of space itself. The model is mathematically equivalent to an empty FLRW universe with negative spatial curvature and linear expansion.", "model_status": "Historical", "gradient": {"gradient_assessment_id": "8", "model_id": "4", "gradient_strategy": "FORMATIVE", "temporal_architecture": null, "development_status": null, "development_rationale": null, "overall_severity": null, "assessment_summary": "The finite beginning describes the expanding cosmological configuration, not necessarily the creation of spacetime or an initial physical gradient.", "assessment_rationale": null, "notes": null, "date_updated": "2026-11-04 09:28:05.449644+00"}, "responses": [{"response_id": "23", "constraint_id": "1", "constraint_name": "Cosmological redshift", "display_order": "1", "core_explanation": "Milne cosmology explains cosmological redshift through the special-relativistic Doppler effect, arising from the relative recessional motion of galaxies following inertial trajectories through flat spacetime. The mechanism provides a mathematically defined relationship between recession velocity and observed redshift, accommodating arbitrarily large redshifts without superluminal velocities.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "NONE", "assessment_summary": "Milne provides a mathematically developed explanation for cosmological redshift through special-relativistic kinematics. The mechanism accounts for the observed wavelength shifts without requiring superluminal recession velocities, and no significant observational conflict has been identified within the scope of this constraint. Quantitative tests of the model's distance–redshift relationship are assessed separately under the Distance Ladder constraint.", "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "17", "mechanism_name": "Cosmological Kinematic Redshift", "mechanism_description": "Cosmological redshift arises from the relative recessional motion of emitters and observers, governed by the relativistic Doppler effect. In Milne cosmology, galaxies follow inertial trajectories through flat spacetime, with their relative velocities producing the observed wavelength shifts without requiring the expansion of space itself.", "family_name": "Kinematic Effects", "role": "Primary", "response_description": null}]}, {"response_id": "25", "constraint_id": "2", "constraint_name": "Distance ladder", "display_order": "2", "core_explanation": "Milne cosmology provides a mathematically defined distance–redshift relationship derived from its kinematic expansion and spacetime geometry. It is compatible with the local distance ladder and reproduces the approximately linear Hubble relationship at low redshift.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "HIGH", "assessment_summary": "At greater distances, the model predicts a specific luminosity–distance relationship that can be tested against standardised Type Ia supernovae. Modern supernova compilations favour a different relationship, placing Milne under significant quantitative pressure. However, uncertainties in supernova standardisation, including possible progenitor-age effects, remain relevant to the interpretation of these discrepancies.", "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "17", "mechanism_name": "Cosmological Kinematic Redshift", "mechanism_description": "Cosmological redshift arises from the relative recessional motion of emitters and observers, governed by the relativistic Doppler effect. In Milne cosmology, galaxies follow inertial trajectories through flat spacetime, with their relative velocities producing the observed wavelength shifts without requiring the expansion of space itself.", "family_name": "Kinematic Effects", "role": "Primary", "response_description": null}, {"mechanism_id": "4", "mechanism_name": "Local distance-ladder calibration", "mechanism_description": "Distances are calibrated sequentially from geometric anchors such as parallax to standardisable stellar indicators including Cepheids and/or TRGB, and then to Type Ia supernovae at larger distances.", "family_name": "Distance Calibration", "role": "Primary", "response_description": null}]}, {"response_id": "26", "constraint_id": "3", "constraint_name": "Light-element abundances", "display_order": "3", "core_explanation": null, "development_status": "NOT_ADDRESSED", "development_rationale": "Milne cosmology does not provide an established mechanism for producing the observed primordial abundances of helium, deuterium and lithium. Its original formulation describes a kinematically expanding distribution of galaxies in flat spacetime, without a physical model of the hot, dense conditions and nuclear processes required for primordial nucleosynthesis.", "overall_severity": null, "assessment_summary": null, "assessment_rationale": null, "notes": "Related linearly coasting cosmologies have explored alternative nucleosynthesis mechanisms, including scenarios capable of producing significant primordial helium. However, reproducing the observed deuterium abundance remains particularly challenging, and these extensions introduce additional physical assumptions beyond Milne's original model.", "mechanisms": []}, {"response_id": "27", "constraint_id": "4", "constraint_name": "Cosmic microwave background", "display_order": "4", "core_explanation": null, "development_status": "NOT_ADDRESSED", "development_rationale": "Milne cosmology does not provide an established explanation for the origin of the cosmic microwave background or its observed near-perfect blackbody spectrum.  Although its kinematic framework can describe the propagation and redshifting of an existing thermal radiation field, it does not specify the physical conditions or thermalisation processes responsible for generating that radiation. Explaining the observed spectrum therefore requires additional assumptions or mechanisms beyond the original model.", "overall_severity": null, "assessment_summary": null, "assessment_rationale": null, "notes": null, "mechanisms": []}, {"response_id": "28", "constraint_id": "5", "constraint_name": "Cosmic Dipoles", "display_order": "5", "core_explanation": "Milne cosmology provides a kinematic explanation for cosmic dipoles through the observer's motion relative to an isotropic cosmological distribution. Special-relativistic Doppler effects and aberration can account for directional anisotropies in radiation and the observed number counts of galaxies and quasars.", "development_status": "DEVELOPED", "development_rationale": null, "overall_severity": "MEDIUM", "assessment_summary": "The mechanism predicts broadly aligned kinematic dipoles, although their amplitudes depend on the properties of the observed source populations. However, reported radio-galaxy and quasar dipole amplitudes exceed conventional kinematic expectations, creating an unresolved observational tension.  Milne also does not independently explain the origin of the CMB radiation field, making its explanation of the CMB dipole conditional on the existence of that background.", "assessment_rationale": null, "notes": null, "mechanisms": [{"mechanism_id": "12", "mechanism_name": "Doppler dipole from motion relative to the CMB rest frame", "mechanism_description": "Relative motion between an observer and a radiation field produces direction-dependent Doppler shifts, creating a dipolar anisotropy in the observed frequency or temperature.", "family_name": "Kinematic Effects", "role": "Primary", "response_description": null}]}, {"response_id": "29", "constraint_id": "6", "constraint_name": "CMB anisotropies / power spectrum", "display_order": "6", "core_explanation": null, "development_status": "NOT_ADDRESSED", "development_rationale": null, "overall_severity": null, "assessment_summary": "Milne cosmology does not provide an established explanation for the observed CMB temperature anisotropies or their angular power spectrum, including the characteristic acoustic peaks.  The original model lacks a physical account of the early radiation and matter interactions, density perturbations and acoustic processes needed to generate these structures. Although its spacetime geometry provides a basis for calculating angular distances, it does not independently predict the observed power spectrum.  Alternative cosmologies employing linear expansion have explored mechanisms for generating CMB anisotropies, but these introduce additional physics beyond Milne's original formulation.", "assessment_rationale": null, "notes": null, "mechanisms": []}, {"response_id": "30", "constraint_id": "7", "constraint_name": "CMB temperature with redshift", "display_order": "7", "core_explanation": null, "development_status": "PROPOSED", "development_rationale": null, "overall_severity": "MEDIUM", "assessment_summary": "Milne cosmology's kinematic redshift mechanism can reproduce the observed CMB temperature–redshift relationship, T(z) = T₀(1 + z), provided an initially thermal radiation field is assumed.  The relativistic redshifting of freely propagating photons allows a blackbody spectrum to retain its thermal form while its effective temperature decreases with cosmic time. This produces a relationship consistent with observations.", "assessment_rationale": "However, Milne's original cosmology does not establi const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const devBadge = v => `<span class="badge dev-${v || 'blank'}">${esc(v ? v.replaceAll('_',' ') : 'NOT ASSESSED')}</span>`;
const sevBadge = v => `<span class="badge sev-${v || 'blank'}">${esc(v || 'NOT ASSESSED')}</span>`;
const val = (label, text) => text ? `<div class="section-label">${esc(label)}</div><div class="text">${esc(text)}</div>` : '';

let selectedModel = DB.models[0].model_id;
let selectedConstraint = DB.constraints[0].constraint_id;
let selectedMechanism = DB.mechanisms[0]?.mechanism_id;

function modelLabel(m) { return m.short_name || m.name; }

function renderMechanismList(items) {
  if (!items?.length) return `<div class="empty">No mechanism linked.</div>`;
  return items.map(x => `
    <div class="mechanism">
      <div class="mechanism-top">
        <strong>${esc(x.mechanism_name)}</strong>
        <span class="badge dev-QUALITATIVE">${esc(x.role || 'Role not set')}</span>
      </div>
      <div class="family">${esc(x.family_name || '')}</div>
      ${x.response_description ? `<div class="text" style="margin-top:7px">${esc(x.response_description)}</div>` : ''}
    </div>`).join('');
}

function responseCard(r) {
  return `<details class="response">
    <summary>
      <div class="summary-row">
        <span class="num">${esc(r.display_order)}</span>
        <div class="summary-main">
          <div class="summary-title">${esc(r.constraint_name)}</div>
          <div class="badges" style="margin-top:6px">${devBadge(r.development_status)}${sevBadge(r.overall_severity)}</div>
        </div>
      </div>
    </summary>
    <div class="response-body">
      ${val('Core explanation', r.core_explanation)}
      ${val('Development rationale', r.development_rationale)}
      ${r.mechanisms?.length ? `<div class="section-label">Mechanisms</div>${renderMechanismList(r.mechanisms)}` : ''}
      ${val('Assessment summary', r.assessment_summary)}
      ${val('Assessment rationale', r.assessment_rationale)}
      ${val('Notes', r.notes)}
    </div>
  </details>`;
}

function renderModels() {
  const root = document.getElementById('view-models');
  const current = DB.models.find(m => m.model_id === selectedModel) || DB.models[0];
  root.innerHTML = `<div class="grid">
    <aside class="sidebar">
      <div class="side-title">Models</div>
      ${DB.models.map(m => `<button class="item ${m.model_id===current.model_id?'active':''}" data-model="${m.model_id}">
        <strong>${esc(modelLabel(m))}</strong><small>${esc(m.model_status || '')}</small></button>`).join('')}
    </aside>
    <div>
      <div class="card">
        <div class="model-head">
          <div><div class="model-title">${esc(modelLabel(current))}</div><div class="meta">${esc(current.name)} · ${esc(current.model_status || '')}</div></div>
          <div class="badges">
            ${current.gradient?.gradient_strategy ? `<span class="badge dev-QUALITATIVE">${esc(current.gradient.gradient_strategy)}</span>` : ''}
            ${current.gradient?.overall_severity ? sevBadge(current.gradient.overall_severity) : ''}
          </div>
        </div>
        ${current.description ? `<div class="text" style="margin-top:12px">${esc(current.description)}</div>` : ''}
        ${current.gradient?.assessment_summary ? val('Gradient assessment', current.gradient.assessment_summary) : ''}
      </div>
      ${current.responses.map(responseCard).join('')}
    </div>
  </div>`;
  root.querySelectorAll('[data-model]').forEach(b => b.addEventListener('click', () => {
    selectedModel = b.dataset.model; renderModels();
  }));
}

function renderConstraints() {
  const root = document.getElementById('view-constraints');
  const c = DB.constraints.find(x => x.constraint_id === selectedConstraint) || DB.constraints[0];
  root.innerHTML = `<div class="grid">
    <aside class="sidebar">
      <div class="side-title">Constraints</div>
      ${DB.constraints.map(x => `<button class="item ${x.constraint_id===c.constraint_id?'active':''}" data-constraint="${x.constraint_id}">
        <strong>${esc(x.display_order)}. ${esc(x.name)}</strong></button>`).join('')}
    </aside>
    <div>
      <div class="card"><div class="model-title">${esc(c.display_order)}. ${esc(c.name)}</div><div class="meta">Same observation, different model responses.</div></div>
      <div class="compare">
        ${DB.models.map(m => {
          const r = m.responses.find(r => r.constraint_id === c.constraint_id);
          return `<div class="card">
            <div class="model-head"><div class="model-title" style="font-size:18px">${esc(modelLabel(m))}</div>
            <div class="badges">${devBadge(r?.development_status)}${sevBadge(r?.overall_severity)}</div></div>
            ${r ? val('Core explanation', r.core_explanation) + val('Development rationale',r.development_rationale) +
              (r.mechanisms?.length ? `<div class="section-label">Mechanisms</div>${renderMechanismList(r.mechanisms)}` : '') +
              val('Assessment summary',r.assessment_summary) + val('Assessment rationale',r.assessment_rationale) + val('Notes',r.notes)
              : '<div class="empty" style="margin-top:12px">No response record.</div>'}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
  root.querySelectorAll('[data-constraint]').forEach(b => b.addEventListener('click', () => {
    selectedConstraint = b.dataset.constraint; renderConstraints();
  }));
}

function renderMechanisms() {
  const root = document.getElementById('view-mechanisms');
  const mech = DB.mechanisms.find(x => x.mechanism_id === selectedMechanism) || DB.mechanisms[0];
  if (!mech) { root.innerHTML = '<div class="card">No linked mechanisms.</div>'; return; }
  root.innerHTML = `<div class="grid">
    <aside class="sidebar">
      <div class="side-title">Mechanisms in use</div>
      ${DB.mechanisms.map(x => `<button class="item ${x.mechanism_id===mech.mechanism_id?'active':''}" data-mechanism="${x.mechanism_id}">
        <strong>${esc(x.name)}</strong><small>${esc(x.family)} · ${x.uses.length} use${x.uses.length===1?'':'s'}</small></button>`).join('')}
    </aside>
    <div>
      <div class="card">
        <div class="meta">${esc(mech.family)}</div>
        <div class="model-title">${esc(mech.name)}</div>
        ${mech.description ? `<div class="text" style="margin-top:10px">${esc(mech.description)}</div>` : ''}
      </div>
      <div class="card">
        <div class="side-title" style="padding-left:0">Used by responses</div>
        ${mech.uses.map(u => `<div class="mechanism">
          <div class="mechanism-top"><strong>${esc(u.model)} → ${esc(u.constraint)}</strong><span class="badge dev-QUALITATIVE">${esc(u.role || '')}</span></div>
          ${u.description ? `<div class="text" style="margin-top:7px">${esc(u.description)}</div>` : ''}
        </div>`).join('')}
      </div>
    </div>
  </div>`;
  root.querySelectorAll('[data-mechanism]').forEach(b => b.addEventListener('click', () => {
    selectedMechanism = b.dataset.mechanism; renderMechanisms();
  }));
}

document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(x => x.classList.add('hidden'));
  document.getElementById('view-' + btn.dataset.view).classList.remove('hidden');
  if (btn.dataset.view === 'models') renderModels();
  if (btn.dataset.view === 'constraints') renderConstraints();
  if (btn.dataset.view === 'mechanisms') renderMechanisms();
}));

renderModels(); renderConstraints(); renderMechanisms();
</script>
</body>
</html>
